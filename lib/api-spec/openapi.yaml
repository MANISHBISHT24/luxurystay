openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Luxury hotel booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: hotel
  - name: bookings
  - name: admin
  - name: contact
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /hotel:
    get:
      operationId: getHotel
      tags: [hotel]
      summary: Get public hotel details
      responses:
        "200":
          description: Hotel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
  /room-types:
    get:
      operationId: getRoomTypes
      tags: [hotel]
      summary: Search rooms and date availability
      parameters:
        - { in: query, name: checkIn, schema: { type: string, format: date } }
        - { in: query, name: checkOut, schema: { type: string, format: date } }
        - { in: query, name: adults, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { in: query, name: children, schema: { type: integer, minimum: 0, maximum: 12 } }
        - { in: query, name: rooms, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: minPrice, schema: { type: integer, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: integer, minimum: 0 } }
        - { in: query, name: amenities, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        "200":
          description: Matching published room types with availability and date pricing
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomType" }
  /room-types/{roomTypeId}:
    get:
      operationId: getRoomType
      tags: [hotel]
      summary: Get room details
      parameters:
        - { in: path, name: roomTypeId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomType" }
        "404": { description: Not found }
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a pending-payment booking and hold inventory
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Pending payment booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409": { description: Availability changed or idempotency conflict }
        "401": { description: Sign-in required }
  /bookings/me:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List bookings belonging to the signed-in customer
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Customer bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { description: Sign-in required }
  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking owned by the signed-in customer
      security: [{ clerkSession: [] }]
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { description: Not found }
  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel an eligible booking
      security: [{ clerkSession: [] }]
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409": { description: Booking cannot be cancelled }
        "404": { description: Not found }
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Send a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201": { description: Message received }
  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [contact]
      summary: Subscribe to hotel news
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterInput" }
      responses:
        "201": { description: Subscription saved }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get booking and occupancy summary
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "403": { description: Administrator access required }
  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: Search and filter all bookings
      security: [{ clerkSession: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: status, schema: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, EXPIRED] } }
      responses:
        "200":
          description: Paginated bookings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookingPage" }
        "403": { description: Administrator access required }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    Hotel:
      type: object
      required: [name, tagline, location, description, phone, email, amenities]
      properties:
        name: { type: string }
        tagline: { type: string }
        location: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string }
        amenities: { type: array, items: { type: string } }
    RoomType:
      type: object
      required: [id, name, category, description, imageUrl, gallery, maxGuests, bed, sizeSqm, amenities, pricePerNight, currency, inventory, availableRooms, published]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        gallery: { type: array, items: { type: string } }
        maxGuests: { type: integer }
        bed: { type: string }
        sizeSqm: { type: integer }
        amenities: { type: array, items: { type: string } }
        pricePerNight: { type: integer, description: Integer minor units (paise) }
        currency: { type: string }
        inventory: { type: integer }
        availableRooms: { type: integer }
        published: { type: boolean }
    BookingInput:
      type: object
      required: [roomTypeId, checkIn, checkOut, rooms, adults, children, guestName, guestEmail, guestPhone, idempotencyKey]
      properties:
        roomTypeId: { type: string, format: uuid }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        rooms: { type: integer, minimum: 1, maximum: 8 }
        adults: { type: integer, minimum: 1, maximum: 12 }
        children: { type: integer, minimum: 0, maximum: 12 }
        guestName: { type: string, minLength: 2, maxLength: 120 }
        guestEmail: { type: string, format: email }
        guestPhone: { type: string, minLength: 6, maxLength: 30 }
        specialRequests: { type: string, maxLength: 1200 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
    Booking:
      type: object
      required: [id, reference, status, roomTypeId, roomName, checkIn, checkOut, nights, rooms, adults, children, guestName, guestEmail, subtotalAmount, taxAmount, serviceFeeAmount, totalAmount, currency, paymentStatus, holdExpiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, EXPIRED] }
        roomTypeId: { type: string, format: uuid }
        roomName: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        rooms: { type: integer }
        adults: { type: integer }
        children: { type: integer }
        guestName: { type: string }
        guestEmail: { type: string, format: email }
        subtotalAmount: { type: integer, description: Integer minor units (paise) }
        taxAmount: { type: integer, description: Integer minor units (paise) }
        serviceFeeAmount: { type: integer, description: Integer minor units (paise) }
        totalAmount: { type: integer, description: Integer minor units (paise) }
        currency: { type: string }
        paymentStatus: { type: string, enum: [NOT_STARTED, PENDING, PAID, FAILED, REFUNDED] }
        holdExpiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        subject: { type: string, minLength: 2, maxLength: 200 }
        message: { type: string, minLength: 5, maxLength: 3000 }
    NewsletterInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    AdminOverview:
      type: object
      required: [totalBookings, pendingBookings, confirmedBookings, occupancyPercent, grossRevenue, currency, recentBookings]
      properties:
        totalBookings: { type: integer }
        pendingBookings: { type: integer }
        confirmedBookings: { type: integer }
        occupancyPercent: { type: number }
        grossRevenue: { type: integer }
        currency: { type: string }
        recentBookings: { type: array, items: { $ref: "#/components/schemas/Booking" } }
    AdminBookingPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
